name: Build and Release

# Triggers only on version tags like v1.0.0, v2.3.1, etc.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # needed by softprops/action-gh-release to create the release

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller (--onedir --windowed)
        run: pyinstaller --noconfirm NobetListesi.spec

      - name: Package build output as zip
        run: Compress-Archive -Path dist/NobetListesi -DestinationPath NobetListesi-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NobetListesi-windows
          path: NobetListesi-windows.zip

  build-macos:
    runs-on: macos-latest # arm64 (Apple Silicon) runner
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller (--onedir --windowed)
        run: pyinstaller --noconfirm NobetListesi.spec

      - name: Package build output as zip
        run: |
          cd dist
          zip -r ../NobetListesi-macos.zip NobetListesi.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NobetListesi-macos
          path: NobetListesi-macos.zip

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: NobetListesi-windows
          path: .

      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: NobetListesi-macos
          path: .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            NobetListesi-windows.zip
            NobetListesi-macos.zip
          body: |
            Windows kullanıcıları NobetListesi-windows.zip'i, Mac kullanıcıları NobetListesi-macos.zip'i indirsin, zip'i açıp içindeki uygulamayı çalıştırsın. İlk açılışta güvenlik uyarısı çıkabilir (Windows: Defender SmartScreen "Daha fazla bilgi" → "Yine de çalıştır"; Mac: sağ tık → Aç) — normal, bir kere onaylamak yeterli.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
